services:
  db:
    image: postgres:15-alpine
    container_name: monitoring_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: monitoring_audit
      TZ: Asia/Jakarta
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - audit_network

  minio:
    image: minio/minio
    container_name: monitoring_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - audit_network

  zookeeper:
    image: docker.io/bitnamilegacy/zookeeper:3.8
    container_name: monitoring_zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - audit_network

  kafka:
    image: docker.io/bitnamilegacy/kafka:3.4
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 30s
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - audit_network

  opensearch-node1:
    image: opensearchproject/opensearch:2.11.0
    container_name: monitoring_opensearch
    restart: unless-stopped
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node            # DIAKTIFKAN
      # BARIS cluster.initial_master_nodes DI SINI SUDAH DIHAPUS AGAR TIDAK CRASH
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=mySecurePassword123!
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:9200 | grep -q 'HTTP/1.1 200 OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - audit_network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: monitoring_opensearch_dashboards
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch-node1:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch-node1
    networks:
      - audit_network

  backend:
    build:
      context: ./backend
      dockerfile: docker/backend.Dockerfile
    container_name: monitoring_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      opensearch-node1:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: secret
      DB_NAME: monitoring_audit
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: monitoring-audit-bucket
      MINIO_USE_SSL: "false"
      KAFKA_BROKERS: kafka:29092
      OPENSEARCH_URL: http://opensearch-node1:9200
      SETTING_ENCRYPTION_KEY: sCb2UdNCSu3RBEYLF6IG/18C6VAVuYftUhFB1lzRoyw=
      JWT_SECRET: e83e0b7d5b30893982f9e73988fc3031fa3cee5e5fa7f5fa3c226d8534c7c9b0
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - audit_network

  frontend: 
    build:
      context: ./frontend
      dockerfile: docker/frontend.Dockerfile
      args:
        INTERNAL_BACKEND_URL: http://backend:8080
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:8080
      INTERNAL_BACKEND_URL: http://backend:8080
      MINIO_ENDPOINT: http://minio:9000
    networks:
      - audit_network

volumes:
  db_data:
  minio_data:
  kafka_data:
  opensearch_data:
  backend_uploads:
  backend_logs:

networks:
  audit_network:
    driver: bridge
