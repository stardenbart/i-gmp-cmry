version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: monitoring_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: monitoring_audit
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data


  minio:
    image: minio/minio
    container_name: monitoring_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: monitoring_zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    image: bitnami/kafka:3.4
    container_name: monitoring_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/bitnami/kafka

  opensearch-node1:
    image: opensearchproject/opensearch:2.11.0
    container_name: monitoring_opensearch
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.seed_hosts=opensearch-node1
      - cluster.initial_master_nodes=opensearch-node1
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: monitoring_opensearch_dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch-node1:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch-node1

  backend:
    build:
      context: ./backend
      dockerfile: docker/app/Dockerfile
    container_name: monitoring_backend
    restart: always
    depends_on:
      - db
      - redis
      - minio
      - kafka
      - opensearch-node1
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: secret
      DB_NAME: monitoring_audit
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: monitoring-audit-bucket
      MINIO_USE_SSL: "false"
      KAFKA_BROKERS: kafka:9092
      OPENSEARCH_URL: http://opensearch-node1:9200
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs

volumes:
  db_data:
  minio_data:
  kafka_data:
  opensearch_data:
  backend_uploads:
  backend_logs:
