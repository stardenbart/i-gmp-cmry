basePath: /api/v1
definitions:
  github_com_monitoring-system_backend_internal_domain_inspection.BulkSaveResultRequest:
    properties:
      inspection_id:
        type: string
      results:
        items:
          $ref: '#/definitions/github_com_monitoring-system_backend_internal_domain_inspection.SaveResultRequest'
        type: array
    required:
    - inspection_id
    - results
    type: object
  github_com_monitoring-system_backend_internal_domain_inspection.CreateInspectionRequest:
    properties:
      area_id:
        type: string
      detail_kawasan_id:
        type: string
      kawasan_id:
        type: string
    required:
    - area_id
    - detail_kawasan_id
    - kawasan_id
    type: object
  github_com_monitoring-system_backend_internal_domain_inspection.InspectionStatus:
    enum:
    - Draft
    - Ongoing
    - Completed
    - Approved
    type: string
    x-enum-varnames:
    - InspectionStatusDraft
    - InspectionStatusOngoing
    - InspectionStatusCompleted
    - InspectionStatusApproved
  github_com_monitoring-system_backend_internal_domain_inspection.SaveResultRequest:
    properties:
      checking:
        enum:
        - OK
        - NG
        - NA
        type: string
      keterangan:
        type: string
      nilai:
        minimum: 0
        type: integer
      uraian_id:
        type: string
    required:
    - checking
    - uraian_id
    type: object
  github_com_monitoring-system_backend_internal_domain_inspection.UpdateInspectionStatusRequest:
    properties:
      status:
        allOf:
        - $ref: '#/definitions/github_com_monitoring-system_backend_internal_domain_inspection.InspectionStatus'
        enum:
        - Draft
        - Ongoing
        - Completed
        - Approved
    required:
    - status
    type: object
  github_com_monitoring-system_backend_internal_domain_issue.CreateIssueRequest:
    properties:
      due_date:
        type: string
      issue_pic_user_id:
        type: string
      keterangan:
        type: string
      result_id:
        type: string
    required:
    - issue_pic_user_id
    - result_id
    type: object
  github_com_monitoring-system_backend_internal_domain_issue.IssueStatus:
    enum:
    - Open
    - InProgress
    - PendingValidation
    - Closed
    - Verified
    type: string
