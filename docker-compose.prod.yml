x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: docker.io/library/postgres:15-alpine
    container_name: audit_prod_db
    restart: always
    cpus: 1.5
    mem_limit: 1536m
    mem_reservation: 512m
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      TZ: Asia/Jakarta

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - audit_network

  db-backup:
    build:
      context: ./ops
      dockerfile: postgres-backup.Dockerfile
    image: system-audit-postgres-backup:${APP_IMAGE_TAG:-latest}
    container_name: audit_prod_db_backup
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 256m
    mem_reservation: 64m
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    healthcheck:
      test: ["CMD-SHELL", "find /backups -type f -name '*.dump' -mmin -1500 | grep -q ."]
      interval: 30m
      timeout: 10s
      retries: 3
      start_period: 5m
    volumes:
      - postgres_backups:/backups
    logging: *default-logging
    networks:
      - audit_network

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: audit_prod_redis
    restart: always
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging
    volumes:
      - redis_data:/data
    networks:
      - audit_network

  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: audit_prod_minio
    restart: always
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    logging: *default-logging
    networks:
      - audit_network

  zookeeper:
    image: docker.io/bitnamilegacy/zookeeper:3.8
    container_name: audit_prod_zookeeper
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | timeout 5 nc 127.0.0.1 2181 | grep -q 'Mode:'"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 20s
    volumes:
      - zookeeper_data:/bitnami/zookeeper
    logging: *default-logging
    networks:
      - audit_network

  kafka:
    image: docker.io/bitnamilegacy/kafka:3.4
    container_name: audit_prod_kafka
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1024m
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=INTERNAL://:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - kafka_data:/bitnami/kafka
    logging: *default-logging
    networks:
      - audit_network

  opensearch-node1:
    image: docker.io/opensearchproject/opensearch:2.11.0
    container_name: audit_prod_opensearch
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1024m
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:9200 | grep -q 'HTTP/1.1 200 OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    logging: *default-logging
    networks:
      - audit_network

  backend:
    build:
      context: ./backend
      dockerfile: docker/backend.Dockerfile
    image: system-audit-backend:${APP_IMAGE_TAG:-latest}
    container_name: audit_prod_backend
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    depends_on:
      - db
      - redis
      - minio
      - zookeeper
      - kafka
      - opensearch-node1
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      TZ: Asia/Jakarta
      # Website address used for links in emails (e.g. the Kawasan report).
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_OUTPUT: console
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: monitoring-audit-bucket
      MINIO_USE_SSL: "false"
      KAFKA_BROKERS: kafka:29092
      OPENSEARCH_URL: http://opensearch-node1:9200
      SETTING_ENCRYPTION_KEY: ${SETTING_ENCRYPTION_KEY:?SETTING_ENCRYPTION_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Web Push (optional): leave unset on the host .env to disable push
      # sending — the in-app notification bell keeps working either way.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Session cookies (backend/config/config.go). COOKIE_SECURE must be
      # "false" on a plain-HTTP deployment (no reverse-proxy TLS yet) —
      # otherwise the browser silently drops the Secure cookie and every
      # login bounces straight back to /login. Flip to "true" once TLS is
      # live (docker-compose.proxy.yml) and set ENABLE_HSTS=true on the
      # frontend at the same time.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    logging: *default-logging
    networks:
      - audit_network

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/frontend.Dockerfile
      args:
        INTERNAL_BACKEND_URL: http://backend:8080
        # Must match VAPID_PUBLIC_KEY above exactly, or the subscribe
        # button will silently fail (build-time value, not runtime).
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    image: system-audit-frontend:${APP_IMAGE_TAG:-latest}
    container_name: audit_prod_frontend
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:8080
      INTERNAL_BACKEND_URL: http://backend:8080
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "3000:3000"
    logging: *default-logging
    networks:
      - audit_network

volumes:
  db_data:
  redis_data:
  minio_data:
  zookeeper_data:
  kafka_data:
  opensearch_data:
  backend_uploads:
  backend_logs:
  postgres_backups:

networks:
  audit_network:
    driver: bridge
